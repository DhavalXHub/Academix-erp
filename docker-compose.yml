services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/academix
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-to-a-long-random-secret-before-deploy
      JWT_ACCESS_EXPIRES: 15m
      CLIENT_ORIGIN: http://localhost:5000

volumes:
  mongo_data:
